[main]
network=arbitrum-sepolia

# A network section can list several RPC endpoints, separated by commas:
#
#   http_provider=https://rpc.example.org,https://rpc2.example.org
#
# suse-distro-check, the zypp repoverification plugin and the spodman/OCI
# checks query every listed endpoint in parallel, require all of them to be
# reachable and require all of them to return the same data (at the same
# block). An endpoint that is down, or that disagrees with the others, is
# reported as rpc_error / consensus failure and therefore rejects the
# repository or image at the levels configured in [defaults].
#
# distro_tool sends transactions to the first endpoint of the list only; the
# endpoints it reads from are not cross-checked.

[hoodi]
# Public hoodi test network
http_provider=https://rpc.hoodi.ethpandaops.io,https://ethereum-hoodi-rpc.publicnode.com
chainid=560048
# NOTE: this address predates the security levels and the contract versioning:
# it has no compatibility_level() view and its boolean known_critical_issues
# flag reads as the level "low" (1) / not_set (0). Every current tool rejects it
# with a "compatibility" failure. Deploy the current ape/contracts/distro.vy
# and update this address.
contract=0x02724c2d1e76Ea3A24247A48F959532cDb152Fb6
#contract=0x5B9b8965E2d949A74cBb83e1B03560905793f1ea

[sepolia]
# Public sepolia test network
http_provider=https://ethereum-sepolia-rpc.publicnode.com
chainid=11155111
contract=

[arbitrum-sepolia]
# Arbitrum Sepolia, a second layer test network
# Same contract, same tooling: the tool only needs an EVM endpoint, a chain id
# and the contract address, so a rollup works like any other network.
http_provider=https://arbitrum-sepolia-rpc.publicnode.com,https://sepolia-rollup.arbitrum.io/rpc,https://arbitrum-sepolia.drpc.org
chainid=421614
contract=0x02724c2d1e76Ea3A24247A48F959532cDb152Fb6

[arbitrum]
# Arbitrum One, the Arbitrum main network. Same contract and the same tooling
# as on Arbitrum Sepolia: the tool only needs an EVM endpoint, a chain id and
# the contract address, so a rollup works like any other network.
http_provider=https://arb1.arbitrum.io/rpc,https://arbitrum-one-rpc.publicnode.com
chainid=42161
contract=

[mainnet]
# Production setup, we don't have the contract deployed there yet.
http_provider=
chainid=1
contract=

[anvil]
# for local development
http_provider=http://127.0.0.1:8545
chainid=31337
contract=0x12aedb6639c160b051be89b77717f46eafac282b

# ---------------------------------------------------------------------------
# Repository policy for the zypp repoverification plugin.
#
# libzypp runs every executable in /usr/lib/zypp/plugins/repoverification on
# each metadata refresh and passes the repository alias. Only aliases that have
# a [repo:<alias>] section below are enforced; all other repositories are
# handled by the 'unmanaged' setting (allow|warn|reject).
#
# Per check values:
#   registered, critical_issues, rpc_error, consensus, current_build, kind,
#   signed, compatibility
#       reject  -> discard the repository (plugin exits non-zero)
#       warn    -> keep the repository, print a warning
#       ignore  -> do not perform the check
#   compatibility: level applied when the contract does not implement the
#       interface level this tool was written for (see compatibility_level() in
#       ape/contracts/distro.vy). A contract published before that view existed,
#       or one with a different level, would be read as if it were current, so
#       the check is a hard error by default. Deploy the current contract and
#       update "contract" instead of lowering this.
#   consensus: level of a disagreement between the configured RPC endpoints
#       (all endpoints must return the same data)
#   min_attestation = off | outstanding | approved
#       minimum accepted reproducibility attestation. A rejected attestation
#       fails unless the check is disabled with "off", in which case it is
#       reported as a warning.
#   max_critical_issues = not_set | low | moderate | important | critical
#       highest security level of a build that is still accepted. The security
#       team reports the level of a build on-chain with
#       "distro_tool set-security-level <verification> <level>", and a report
#       also covers every build of the same product that was registered before
#       the reported one; builds registered later start at not_set again.
#       Anything above this value fails with the level configured for
#       critical_issues. The default accepts only builds without reported
#       issues. Raise it (e.g. max_critical_issues = moderate) to keep using a
#       build with known low or moderate issues.
#   network = <section>
#       override the network/contract section for this repository.
# ---------------------------------------------------------------------------

[defaults]
unmanaged = allow
registered = reject
critical_issues = reject
compatibility = reject
rpc_error = reject
consensus = reject
current_build = warn
kind = warn
# GPG signing is optional and off by default: the on-chain verification is
# independent of the package signature.
signed = ignore
min_attestation = outstanding
max_critical_issues = not_set

# Example: enforce a repository and promote the "current build" warning to a
# hard requirement. Replace the alias with a real repository alias.
#[repo:repo-oss]
#network = hoodi
#current_build = reject

# ---------------------------------------------------------------------------
# Container image policy for the spodman front end.
#
# Images are matched by the prefix of their registry/repository scope, e.g.
# [oci:registry.opensuse.org/opensuse] also covers
# registry.opensuse.org/opensuse/leap. Images are identified on-chain by their
# manifest digest (sha256:...) and use the same policy values as repositories.
# Images without a matching section follow the 'unmanaged' setting.
# ---------------------------------------------------------------------------

# Example: enforce images below a registry namespace.
#[oci:registry.opensuse.org/opensuse]
#network = hoodi
#kind = reject
