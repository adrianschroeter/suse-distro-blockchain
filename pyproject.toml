# Packaging for suse-distro-blockchain.
#
# Uses setuptools with PEP 621 metadata. Installing the built wheel (or this
# directory) provides the console scripts `suse-distro-check` and `distro_tool`.
#
# The generated contract artifact (distro_contract.py + contracts/distro.vy copy)
# is committed, so the wheel build needs no extra step. After contract changes
# run `make contract-build` and commit the regenerated files.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "suse-distro-blockchain"
version = "0.0.2"
description = "A tool to verify the state of current used repositories"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Adrian Schroeter", email = "adrian@suse.de" },
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "web3>=7.5.0,<8",
    "eth-account",
    "iniparse",
    "termcolor",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.scripts]
suse-distro-check = "suse_distro_blockchain.suse_distro_check:main"
suse-distro-oci-check = "suse_distro_blockchain.oci_check:main"
distro_tool = "suse_distro_blockchain.distro_tool:main"

[project.optional-dependencies]
tester = ["eth-tester"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suse_distro_blockchain = ["contracts/*.vy"]

[tool.coverage.run]
branch = true
source = ["suse_distro_blockchain"]

[tool.coverage.report]
show_missing = true
